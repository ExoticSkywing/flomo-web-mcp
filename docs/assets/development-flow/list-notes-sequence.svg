<svg xmlns="http://www.w3.org/2000/svg" width="1060" height="430" viewBox="0 0 1060 430" role="img" aria-labelledby="title desc">
  <title id="title">list_notes 调用链路</title>
  <desc id="desc">MCP 客户端调用 list_notes，经过读取 client、HTTP client、flomo Web 和 parser，最终返回 Memo 数组。</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#475569"/>
    </marker>
    <style>
      .head { fill: #eff6ff; stroke: #2563eb; stroke-width: 1.3; rx: 7; }
      .line { stroke: #94a3b8; stroke-width: 1.1; stroke-dasharray: 5 5; }
      .msg { stroke: #475569; stroke-width: 1.3; fill: none; marker-end: url(#arrow); }
      .ret { stroke: #64748b; stroke-width: 1.3; fill: none; stroke-dasharray: 4 4; marker-end: url(#arrow); }
      .text { font-family: Arial, "Microsoft YaHei", sans-serif; font-size: 13px; fill: #0f172a; text-anchor: middle; dominant-baseline: middle; }
      .label { font-size: 12px; fill: #334155; }
    </style>
  </defs>

  <g>
    <rect class="head" x="20" y="24" width="130" height="44"/><text class="text" x="85" y="46">MCP 客户端</text>
    <rect class="head" x="190" y="24" width="130" height="44"/><text class="text" x="255" y="46">list_notes</text>
    <rect class="head" x="360" y="24" width="150" height="44"/><text class="text" x="435" y="46">flomoReadClient</text>
    <rect class="head" x="550" y="24" width="150" height="44"/><text class="text" x="625" y="46">FlomoHttpClient</text>
    <rect class="head" x="740" y="24" width="130" height="44"/><text class="text" x="805" y="46">flomo Web</text>
    <rect class="head" x="910" y="24" width="130" height="44"/><text class="text" x="975" y="46">memoParser</text>
  </g>

  <line class="line" x1="85" y1="68" x2="85" y2="400"/>
  <line class="line" x1="255" y1="68" x2="255" y2="400"/>
  <line class="line" x1="435" y1="68" x2="435" y2="400"/>
  <line class="line" x1="625" y1="68" x2="625" y2="400"/>
  <line class="line" x1="805" y1="68" x2="805" y2="400"/>
  <line class="line" x1="975" y1="68" x2="975" y2="400"/>

  <path class="msg" d="M85 100 L250 100"/><text class="text label" x="168" y="88">call list_notes(limit)</text>
  <path class="msg" d="M255 140 L430 140"/><text class="text label" x="342" y="128">list(limit)</text>
  <path class="msg" d="M435 180 L620 180"/><text class="text label" x="528" y="168">requestJson(READ_ENDPOINT)</text>
  <path class="msg" d="M625 220 L800 220"/><text class="text label" x="712" y="208">GET/POST internal endpoint</text>
  <path class="ret" d="M805 260 L630 260"/><text class="text label" x="718" y="248">raw JSON</text>
  <path class="ret" d="M625 300 L440 300"/><text class="text label" x="532" y="288">raw JSON</text>
  <path class="msg" d="M435 340 L970 340"/><text class="text label" x="702" y="328">parseMemo(raw)</text>
  <path class="ret" d="M975 370 L440 370"/><text class="text label" x="708" y="358">Memo[]</text>
  <path class="ret" d="M435 390 L260 390"/><text class="text label" x="348" y="378">Memo[]</text>
  <path class="ret" d="M255 410 L90 410"/><text class="text label" x="172" y="398">{ ok: true, items }</text>
</svg>
