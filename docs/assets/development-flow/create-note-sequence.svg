<svg xmlns="http://www.w3.org/2000/svg" width="1060" height="470" viewBox="0 0 1060 470" role="img" aria-labelledby="title desc">
  <title id="title">create_note 调用链路</title>
  <desc id="desc">MCP 客户端调用 create_note，经过写入 client 格式化内容，通过 HTTP client 写入 flomo Web，再解析并返回 Memo。</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#475569"/>
    </marker>
    <style>
      .head { fill: #eff6ff; stroke: #2563eb; stroke-width: 1.3; rx: 7; }
      .line { stroke: #94a3b8; stroke-width: 1.1; stroke-dasharray: 5 5; }
      .msg { stroke: #475569; stroke-width: 1.3; fill: none; marker-end: url(#arrow); }
      .ret { stroke: #64748b; stroke-width: 1.3; fill: none; stroke-dasharray: 4 4; marker-end: url(#arrow); }
      .self { stroke: #475569; stroke-width: 1.3; fill: none; marker-end: url(#arrow); }
      .text { font-family: Arial, "Microsoft YaHei", sans-serif; font-size: 13px; fill: #0f172a; text-anchor: middle; dominant-baseline: middle; }
      .label { font-size: 12px; fill: #334155; }
    </style>
  </defs>

  <g>
    <rect class="head" x="20" y="24" width="130" height="44"/><text class="text" x="85" y="46">MCP 客户端</text>
    <rect class="head" x="190" y="24" width="130" height="44"/><text class="text" x="255" y="46">create_note</text>
    <rect class="head" x="360" y="24" width="150" height="44"/><text class="text" x="435" y="46">flomoWriteClient</text>
    <rect class="head" x="550" y="24" width="150" height="44"/><text class="text" x="625" y="46">FlomoHttpClient</text>
    <rect class="head" x="740" y="24" width="130" height="44"/><text class="text" x="805" y="46">flomo Web</text>
    <rect class="head" x="910" y="24" width="130" height="44"/><text class="text" x="975" y="46">memoParser</text>
  </g>

  <line class="line" x1="85" y1="68" x2="85" y2="440"/>
  <line class="line" x1="255" y1="68" x2="255" y2="440"/>
  <line class="line" x1="435" y1="68" x2="435" y2="440"/>
  <line class="line" x1="625" y1="68" x2="625" y2="440"/>
  <line class="line" x1="805" y1="68" x2="805" y2="440"/>
  <line class="line" x1="975" y1="68" x2="975" y2="440"/>

  <path class="msg" d="M85 100 L250 100"/><text class="text label" x="168" y="88">call create_note(content,tags)</text>
  <path class="msg" d="M255 140 L430 140"/><text class="text label" x="342" y="128">create({ content, tags })</text>
  <path class="self" d="M435 176 C500 176 500 206 438 206"/><text class="text label" x="510" y="190">formatCreateContent()</text>
  <path class="msg" d="M435 240 L620 240"/><text class="text label" x="528" y="228">requestJson(WRITE_ENDPOINT, payload)</text>
  <path class="msg" d="M625 280 L800 280"/><text class="text label" x="712" y="268">POST/PUT internal endpoint</text>
  <path class="ret" d="M805 320 L630 320"/><text class="text label" x="718" y="308">raw JSON</text>
  <path class="ret" d="M625 350 L440 350"/><text class="text label" x="532" y="338">raw JSON</text>
  <path class="msg" d="M435 382 L970 382"/><text class="text label" x="702" y="370">parseMemo(raw)</text>
  <path class="ret" d="M975 412 L440 412"/><text class="text label" x="708" y="400">Memo</text>
  <path class="ret" d="M435 432 L260 432"/><text class="text label" x="348" y="420">Memo</text>
  <path class="ret" d="M255 452 L90 452"/><text class="text label" x="172" y="440">{ ok: true, memo }</text>
</svg>
