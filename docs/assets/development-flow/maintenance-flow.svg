<svg xmlns="http://www.w3.org/2000/svg" width="960" height="520" viewBox="0 0 960 520" role="img" aria-labelledby="title desc">
  <title id="title">接口变化时的维护流程</title>
  <desc id="desc">当 tool 失败后，按错误类型分别重新抓 Authorization、重新抓请求、对比 payload 或确认签名规则，然后更新配置或 adapter，运行验证命令并恢复使用。</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#475569"/>
    </marker>
    <style>
      .box { fill: #f8fafc; stroke: #334155; stroke-width: 1.4; rx: 8; }
      .decision { fill: #fff7ed; stroke: #ea580c; stroke-width: 1.4; }
      .action { fill: #eff6ff; stroke: #2563eb; stroke-width: 1.4; rx: 8; }
      .done { fill: #ecfdf5; stroke: #059669; stroke-width: 1.4; rx: 8; }
      .text { font-family: Arial, "Microsoft YaHei", sans-serif; font-size: 14px; fill: #0f172a; text-anchor: middle; dominant-baseline: middle; }
      .small { font-size: 12px; fill: #334155; }
      .line { stroke: #475569; stroke-width: 1.4; fill: none; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect class="box" x="390" y="24" width="180" height="50"/>
  <text class="text" x="480" y="49">tool 突然失败</text>
  <path class="line" d="M480 74 L480 112"/>

  <polygon class="decision" points="480,112 585,167 480,222 375,167"/>
  <text class="text" x="480" y="167">错误类型</text>

  <path class="line" d="M385 167 L190 167"/>
  <text class="text small" x="285" y="154">401 / 403</text>
  <rect class="action" x="40" y="142" width="220" height="70"/>
  <text class="text" x="150" y="164">重新登录 flomo</text>
  <text class="text small" x="150" y="186">重新抓 Authorization</text>

  <path class="line" d="M445 214 L310 300"/>
  <text class="text small" x="346" y="250">404 / 字段缺失</text>
  <rect class="action" x="190" y="300" width="220" height="58"/>
  <text class="text" x="300" y="329">重新抓读取/写入请求</text>

  <path class="line" d="M515 214 L650 300"/>
  <text class="text small" x="612" y="250">payload 错误</text>
  <rect class="action" x="550" y="300" width="220" height="58"/>
  <text class="text" x="660" y="329">对比 Request Payload</text>

  <path class="line" d="M575 167 L770 167"/>
  <text class="text small" x="676" y="154">签名/时间戳错误</text>
  <rect class="action" x="700" y="142" width="220" height="70"/>
  <text class="text" x="810" y="164">确认签名</text>
  <text class="text small" x="810" y="186">或防重放规则</text>

  <path class="line" d="M150 212 L150 388"/>
  <rect class="action" x="60" y="388" width="180" height="50"/>
  <text class="text" x="150" y="413">更新 .env</text>

  <path class="line" d="M300 358 L460 388"/>
  <path class="line" d="M660 358 L500 388"/>
  <path class="line" d="M810 212 L520 388"/>
  <rect class="action" x="360" y="388" width="240" height="50"/>
  <text class="text" x="480" y="413">更新 read/write adapter</text>

  <path class="line" d="M480 438 L480 468"/>
  <rect class="action" x="360" y="468" width="240" height="38"/>
  <text class="text" x="480" y="487">更新 parser/tests</text>

  <path class="line" d="M240 413 L360 413"/>
  <path class="line" d="M600 487 L700 487"/>
  <path class="line" d="M600 413 L700 413"/>
  <rect class="box" x="700" y="392" width="180" height="38"/>
  <text class="text" x="790" y="411">运行验证命令</text>
  <path class="line" d="M790 430 L790 468"/>
  <rect class="done" x="700" y="468" width="180" height="38"/>
  <text class="text" x="790" y="487">恢复 MCP 使用</text>
</svg>
