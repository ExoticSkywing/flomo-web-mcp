<svg xmlns="http://www.w3.org/2000/svg" width="980" height="220" viewBox="0 0 980 220" role="img" aria-labelledby="title desc">
  <title id="title">flomo-mcp 主开发流程</title>
  <desc id="desc">从工程骨架开始，依次验证 MCP 壳子、抓取读取接口、实现读取工具、抓取写入接口、实现写入工具、补充测试并接入 MCP 客户端。</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#475569"/>
    </marker>
    <style>
      .box { fill: #f8fafc; stroke: #334155; stroke-width: 1.4; rx: 8; }
      .done { fill: #ecfdf5; stroke: #059669; }
      .work { fill: #eff6ff; stroke: #2563eb; }
      .test { fill: #fff7ed; stroke: #ea580c; }
      .text { font-family: Arial, "Microsoft YaHei", sans-serif; font-size: 13px; fill: #0f172a; text-anchor: middle; dominant-baseline: middle; }
      .small { font-size: 12px; fill: #334155; }
      .line { stroke: #475569; stroke-width: 1.4; fill: none; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect class="box done" x="20" y="70" width="104" height="64"/>
  <text class="text" x="72" y="94">当前状态</text>
  <text class="text small" x="72" y="116">骨架已完成</text>
  <path class="line" d="M124 102 L154 102"/>

  <rect class="box work" x="154" y="70" width="96" height="64"/>
  <text class="text" x="202" y="94">阶段 1</text>
  <text class="text small" x="202" y="116">验证 MCP</text>
  <path class="line" d="M250 102 L280 102"/>

  <rect class="box work" x="280" y="70" width="96" height="64"/>
  <text class="text" x="328" y="94">阶段 2</text>
  <text class="text small" x="328" y="116">抓读取接口</text>
  <path class="line" d="M376 102 L406 102"/>

  <rect class="box work" x="406" y="70" width="96" height="64"/>
  <text class="text" x="454" y="94">阶段 3</text>
  <text class="text small" x="454" y="116">list_notes</text>
  <path class="line" d="M502 102 L532 102"/>

  <rect class="box work" x="532" y="70" width="108" height="64"/>
  <text class="text" x="586" y="94">阶段 4</text>
  <text class="text small" x="586" y="116">search / get</text>
  <path class="line" d="M640 102 L670 102"/>

  <rect class="box work" x="670" y="70" width="96" height="64"/>
  <text class="text" x="718" y="94">阶段 5</text>
  <text class="text small" x="718" y="116">抓写入接口</text>
  <path class="line" d="M766 102 L796 102"/>

  <rect class="box work" x="796" y="70" width="96" height="64"/>
  <text class="text" x="844" y="94">阶段 6</text>
  <text class="text small" x="844" y="116">create_note</text>
  <path class="line" d="M844 134 C844 176 732 176 712 148"/>

  <rect class="box test" x="532" y="154" width="126" height="50"/>
  <text class="text" x="595" y="174">阶段 7</text>
  <text class="text small" x="595" y="192">测试与健壮性</text>
  <path class="line" d="M532 178 C410 178 300 162 270 138"/>

  <rect class="box done" x="154" y="154" width="112" height="50"/>
  <text class="text" x="210" y="174">阶段 8</text>
  <text class="text small" x="210" y="192">接入 MCP 客户端</text>
</svg>
